name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# Allow the workflow to push the repaired wrapper jar back to the repo.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # GitHub-hosted runners already have the Android SDK preinstalled at
      # /usr/local/lib/android/sdk. We do NOT use android-actions/setup-android
      # (its v3 hard-codes installing the deprecated "tools" package, which no
      # longer exists -> "Failed to find package 'tools'" and exit code 1).
      # Instead we locate the preinstalled sdkmanager, accept licenses, and
      # install exactly the packages our build needs.
      - name: Set up Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          SM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "Using sdkmanager: $SM"
          export PATH="$(dirname "$SM"):$ANDROID_HOME/platform-tools:$PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$(dirname "$SM")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$SM" --licenses
          "$SM" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      # Install Gradle 8.6 directly. We deliberately do NOT use the committed
      # gradle-wrapper.jar (it was corrupted in transit), so we call `gradle`
      # instead of `./gradlew`.
      - name: Install Gradle 8.6
        run: |
          curl -sSL -o /tmp/gradle-8.6-bin.zip https://services.gradle.org/distributions/gradle-8.6-bin.zip
          unzip -q /tmp/gradle-8.6-bin.zip -d /opt
          echo "/opt/gradle-8.6/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Repair gradle-wrapper.jar if corrupted
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          JAR=gradle/wrapper/gradle-wrapper.jar
          SRC=https://raw.githubusercontent.com/gradle/gradle/v8.6.0/gradle/wrapper/gradle-wrapper.jar
          curl -sSL -o /tmp/gw.jar "$SRC"
          if [ ! -s /tmp/gw.jar ]; then
            echo "download failed, skip repair"
            exit 0
          fi
          GENUINE=$(sha256sum /tmp/gw.jar | awk '{print $1}')
          CURRENT=$(sha256sum "$JAR" | awk '{print $1}')
          echo "genuine=$GENUINE current=$CURRENT"
          if [ "$GENUINE" = "$CURRENT" ]; then
            echo "gradle-wrapper.jar already genuine, nothing to do"
            exit 0
          fi
          cp /tmp/gw.jar "$JAR"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add "$JAR"
          git commit -m "chore: repair corrupted gradle-wrapper.jar [skip ci]"
          git push "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" HEAD:${{ github.ref_name }}
          echo "gradle-wrapper.jar repaired and pushed"
